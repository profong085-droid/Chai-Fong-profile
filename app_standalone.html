<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ឆៃហ្វុង | React Mobile App</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1d1b4b',
              pink: '#e85d75',
              cyan: '#38b6ff',
              yellow: '#f7b731',
              purple: '#9c8dc7'
            }
          },
          fontFamily: {
            khmer: ['Kantumruy Pro', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            cursive: ['Kalam', 'cursive']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;0,800;1,600;1,800&family=Plus+Jakarta+Sans:wght@800;900&family=Kalam:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body {
      font-family: 'Kantumruy Pro', -apple-system, sans-serif !important;
      background-color: #dcd6cd;
      color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
      -webkit-font-smoothing: antialiased;
    }
    .profile-avatar-crop {
      background-image: url('Join for faceless income secrets! 🔥.webp');
      background-size: 260% auto;
      background-position: 84% 57.5%;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ReactApp() {
      const [lang, setLang] = useState('km');
      const [liked, setLiked] = useState(false);
      const [likesCount, setLikesCount] = useState(248);
      const [copied, setCopied] = useState(false);
      const [activeSoftware, setActiveSoftware] = useState(null);
      const [showHearts, setShowHearts] = useState([]);

      const t = {
        km: {
          author: "ឆៃហ្វុង",
          portfolio: "ស្នាដៃគំនូរ",
          year: "២០២៥",
          aboutTitle: "អំពីខ្ញុំ!",
          aka: "ហៅក្រៅ៖ ហ្វុង (Fong)",
          greeting: "ជម្រាបសួរ!",
          bio: "ខ្ញុំគឺជាអ្នកគូររូបបកស្រាយ (Illustrator) ដែលមានបេះដូងស្រឡាញ់ការបង្កើតសាច់រឿង និងគំនិតច្នៃប្រឌិតប្លែកៗ។ ស្នាដៃរបស់ខ្ញុំផ្តោតលើការគូររូបឌីជីថល (Digital Drawing), គំនូរសៀវភៅកុមារ, ការឌីហ្សាញតួអង្គ, រឿងគំនូរជីវចល (Comics) និងការរៀបចំទំព័រទស្សនាវដ្តី។ ខ្ញុំតែងតែខិតខំរៀនសូត្រ និងអភិវឌ្ឍសមត្ថភាពជានិច្ច ដើម្បីបង្កើតស្នាដៃថ្មីៗដែលមានជីវិត។",
          eduTitle: "ការអប់រំ",
          eduDesc: "បច្ចុប្បន្នកំពុងសិក្សានៅវិទ្យាស្ថានបច្ចេកវិទ្យាអាមេរិក (ITLA)។",
          skillsTitle: "ជំនាញស្ទាត់ជំនាញ",
          skills: [
            "គំនូរឌីជីថល (Digital Illustration)",
            "គំនូរសៀវភៅកុមារ (Children's Books)",
            "ការឌីហ្សាញតួអង្គ (Character Design)",
            "រឿងគំនូរជីវចល (Comics)",
            "រៀបចំប្លង់ទស្សនាវដ្តី (Magazine Layout)"
          ],
          softwaresTitle: "កម្មវិធីប្រើប្រាស់ស្ទាត់ជំនាញ",
          copiedEmail: "បានចម្លងអ៉ីមែល!",
          toggleLang: "English",
          badge: "React.js Dynamic Web App"
        },
        en: {
          author: "Chai Fong",
          portfolio: "PORTFOLIO",
          year: "2025",
          aboutTitle: "About Me!",
          aka: "A.K.A Fong",
          greeting: "Hi!",
          bio: "I'm an illustrator with a love for storytelling and playful ideas. My work moves between digital drawing, children's illustration, character design, comics, and magazine layout. I'm always eager to learn, grow, and push my creativity further—because every project is a new chance to bring ideas to life.",
          eduTitle: "Education",
          eduDesc: "Currently studying at the Technological Institute of the Americas (ITLA).",
          skillsTitle: "Skills",
          skills: [
            "Digital Illustration",
            "Children's Illustration",
            "Character Design",
            "Comics",
            "Magazine Layout"
          ],
          softwaresTitle: "Softwares",
          copiedEmail: "Email Copied!",
          toggleLang: "ភាសាខ្មែរ",
          badge: "React.js Dynamic Web App"
        }
      }[lang];

      const softwareList = [
        { name: "Procreate", percent: 95 },
        { name: "InDesign", percent: 84 },
        { name: "Photoshop", percent: 65 },
        { name: "Premiere", percent: 48 },
        { name: "Illustrator", percent: 38 }
      ];

      const handleCopyEmail = () => {
        navigator.clipboard.writeText("Fongartcontact@gmail.com");
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleLike = () => {
        setLiked(!liked);
        setLikesCount(prev => liked ? prev - 1 : prev + 1);
      };

      const triggerHearts = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const newHeart = {
          id: Date.now(),
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
        setShowHearts(prev => [...prev, newHeart]);
        setTimeout(() => {
          setShowHearts(prev => prev.filter(h => h.id !== newHeart.id));
        }, 1000);
      };

      return (
        <div className="w-full max-w-[440px] px-2 flex justify-center">
          <div className="w-full bg-white rounded-[36px] shadow-2xl overflow-hidden relative flex flex-col transition-all duration-300">

            {/* FLOAT BAR: LANGUAGE TOGGLE */}
            <div className="absolute top-4 right-4 z-30 flex items-center gap-2">
              <button 
                onClick={() => setLang(l => l === 'km' ? 'en' : 'km')}
                className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur-md shadow-md text-xs font-bold text-brand-navy hover:scale-105 transition-all duration-200 border border-white/60 cursor-pointer"
              >
                <i className="fa-solid fa-globe text-rose-500"></i>
                <span>{t.toggleLang}</span>
              </button>
            </div>

            {/* HERO SECTION WITH EXACT CLONED ARTWORK */}
            <section className="relative w-full h-[445px] overflow-hidden rounded-b-[32px] bg-[#e2f0f9]">
              <div className="absolute inset-0 w-full h-full">
                <img 
                  src="Join for faceless income secrets! 🔥.webp" 
                  alt="Chai Fong Portfolio Hero"
                  className="w-full h-full object-cover object-top"
                />
              </div>
              
              {/* Badge */}
              <div className="absolute bottom-4 left-6 z-20 flex items-center gap-2 bg-white/85 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/60 shadow-lg text-[11px] font-bold text-brand-navy">
                <i className="fa-solid fa-bolt text-yellow-500"></i>
                <span>{t.badge}</span>
              </div>
            </section>

            {/* ABOUT ME SECTION */}
            <section className="p-7 pb-5 bg-white relative">
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-khmer text-2xl font-bold text-gray-500 italic">
                  {t.aboutTitle}
                </h2>
                
                <button 
                  onClick={handleLike}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer ${
                    liked ? 'bg-rose-100 text-rose-600 scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                  }`}
                >
                  <i className={`fa-solid fa-heart ${liked ? 'text-rose-500' : 'text-gray-400'}`}></i>
                  <span>{likesCount}</span>
                </button>
              </div>

              <div className="flex gap-3 items-start justify-between">
                {/* Left Info */}
                <div className="flex-1 max-w-[220px]">
                  <div className="relative mb-3">
                    <h1 className="font-khmer font-extrabold text-[30px] leading-tight text-brand-navy tracking-tight">
                      {lang === 'km' ? (
                        <>ឆៃហ្វុង</>
                      ) : (
                        <>CHAI FONG</>
                      )}
                    </h1>
                    <p className="text-xs text-gray-500 mt-1 font-medium">
                      {t.aka}
                    </p>

                    {/* SVG Curved Arrow */}
                    <svg className="absolute -top-1 -right-[52px] w-[55px] h-[40px] pointer-events-none" viewBox="0 0 100 60" fill="none">
                      <path d="M10 45 Q 50 5 90 25" stroke="#1d1b4b" strokeWidth="2.5" strokeLinecap="round"/>
                      <path d="M80 15 L 92 26 L 78 32" stroke="#1d1b4b" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>

                  <div className="mt-4 text-[11.5px] leading-relaxed text-gray-700">
                    <span className="font-extrabold text-base mr-1.5 text-brand-navy">{t.greeting}</span>
                    <span className="font-normal">{t.bio}</span>
                  </div>
                </div>

                {/* Right Profile Avatar with Interactive Hearts */}
                <div className="flex flex-col items-start w-[140px] relative">
                  <div 
                    onClick={triggerHearts}
                    className="w-[140px] h-[140px] rounded-full overflow-hidden relative shadow-xl mb-4 cursor-pointer hover:scale-105 transition-all duration-300 profile-avatar-crop group"
                    title="Click for interactive hearts!"
                  >
                    <div className="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-all" />
                    {showHearts.map(h => (
                      <span 
                        key={h.id} 
                        className="absolute text-xl animate-ping pointer-events-none"
                        style={{ left: h.x, top: h.y }}
                      >
                        💖
                      </span>
                    ))}
                  </div>

                  {/* Social Links */}
                  <div className="flex flex-col gap-2 w-full">
                    <a href="#" className="flex items-center gap-2 text-xs font-semibold text-gray-700 hover:text-rose-500 transition-colors">
                      <i className="fa-regular fa-compass text-brand-navy"></i>
                      <span>Fong.art</span>
                    </a>
                    <button 
                      onClick={handleCopyEmail}
                      className="flex items-center gap-2 text-xs font-semibold text-gray-700 hover:text-rose-500 transition-colors text-left cursor-pointer"
                    >
                      <i className="fa-regular fa-envelope text-brand-navy shrink-0"></i>
                      <span className="truncate">{copied ? t.copiedEmail : 'Fongartcontact@...'}</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            {/* EDUCATION & SKILLS SECTION */}
            <section className="px-7 py-4 bg-white">
              <div className="grid grid-cols-2 gap-5">
                
                {/* Education */}
                <div className="relative">
                  <div className="relative flex items-center mb-2">
                    <svg className="absolute -top-6 -left-3 w-8 h-8" viewBox="0 0 40 40" fill="none">
                      <path d="M5 25 C 10 5, 25 5, 20 20 C 15 35, 30 35, 35 20" stroke="#e85d75" strokeWidth="2.5" strokeLinecap="round"/>
                    </svg>
                    <h3 className="font-khmer text-xl font-extrabold text-brand-navy tracking-tight">
                      {t.eduTitle}
                    </h3>
                  </div>
                  <p className="text-[11.5px] leading-relaxed text-gray-600 font-normal">
                    {t.eduDesc}
                  </p>
                </div>

                {/* Skills */}
                <div>
                  <div className="flex items-center mb-2">
                    <h3 className="font-khmer text-xl font-extrabold text-brand-navy tracking-tight">
                      {t.skillsTitle}
                    </h3>
                    <svg className="w-5 h-5 ml-1.5" viewBox="0 0 30 30" fill="none">
                      <path d="M5 15 L 15 25 L 25 5" stroke="#e85d75" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                  <ul className="list-disc pl-4 space-y-0.5">
                    {t.skills.map((skill, i) => (
                      <li key={i} className="text-[11.5px] text-gray-700 font-medium leading-relaxed">
                        {skill}
                      </li>
                    ))}
                  </ul>
                </div>

              </div>
            </section>

            {/* SOFTWARES SECTION */}
            <section className="px-7 pb-8 bg-white">
              <h3 className="font-khmer text-xl font-extrabold text-brand-navy tracking-tight mb-4">
                {t.softwaresTitle}
              </h3>

              <div className="flex gap-5 items-start">
                {/* Icons Grid */}
                <div className="flex flex-col gap-2">
                  <div className="flex gap-2">
                    <div 
                      onMouseEnter={() => setActiveSoftware(0)}
                      onMouseLeave={() => setActiveSoftware(null)}
                      className="w-[50px] h-[50px] rounded-xl bg-[#1a1a24] p-2 flex items-center justify-center shadow-md hover:scale-110 transition-transform cursor-pointer"
                      title="Procreate (95%)"
                    >
                      <svg viewBox="0 0 100 100" className="w-full h-full">
                        <path d="M 20 70 Q 50 20 80 50 Q 60 90 20 70" fill="url(#gradSingle)" />
                        <defs>
                          <linearGradient id="gradSingle" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#ff4e50"/>
                            <stop offset="50%" stopColor="#f9d423"/>
                            <stop offset="100%" stop-color="#00c9ff"/>
                          </linearGradient>
                        </defs>
                      </svg>
                    </div>
                    
                    <div 
                      onMouseEnter={() => setActiveSoftware(1)}
                      onMouseLeave={() => setActiveSoftware(null)}
                      className="w-[50px] h-[50px] rounded-xl bg-[#4d001b] text-[#ff3366] font-display font-extrabold text-xl flex items-center justify-center shadow-md hover:scale-110 transition-transform cursor-pointer"
                      title="InDesign (84%)"
                    >
                      Id
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <div 
                      onMouseEnter={() => setActiveSoftware(4)}
                      onMouseLeave={() => setActiveSoftware(null)}
                      className="w-[50px] h-[50px] rounded-xl bg-[#331400] text-[#ff9900] font-display font-extrabold text-lg flex items-center justify-center shadow-md hover:scale-110 transition-transform cursor-pointer"
                      title="Illustrator (38%)"
                    >
                      Ai
                    </div>
                    <div 
                      onMouseEnter={() => setActiveSoftware(3)}
                      onMouseLeave={() => setActiveSoftware(null)}
                      className="w-[50px] h-[50px] rounded-xl bg-[#000055] text-[#9999ff] font-display font-extrabold text-lg flex items-center justify-center shadow-md hover:scale-110 transition-transform cursor-pointer"
                      title="Premiere (48%)"
                    >
                      Pr
                    </div>
                    <div 
                      onMouseEnter={() => setActiveSoftware(2)}
                      onMouseLeave={() => setActiveSoftware(null)}
                      className="w-[50px] h-[50px] rounded-xl bg-[#001d38] text-[#31a8ff] font-display font-extrabold text-lg flex items-center justify-center shadow-md hover:scale-110 transition-transform cursor-pointer"
                      title="Photoshop (65%)"
                    >
                      Ps
                    </div>
                  </div>
                </div>

                {/* Software Bars */}
                <div className="flex-1 flex flex-col gap-3 pt-0.5">
                  {softwareList.map((sw, index) => {
                    const isHovered = activeSoftware === index;
                    return (
                      <div key={index} className="flex flex-col gap-1 group">
                        <div className="flex justify-between items-center text-[11px] font-bold text-brand-navy">
                          <span className={isHovered ? 'text-rose-500 transition-colors' : ''}>{sw.name}</span>
                          <span className="text-[10px] text-gray-500">{sw.percent}%</span>
                        </div>
                        <div className="w-full h-[7px] bg-gray-200 rounded-full overflow-hidden">
                          <div 
                            className={`h-full rounded-full transition-all duration-700 ease-out ${
                              index === 0 ? 'bg-[#222222]' :
                              index === 1 ? 'bg-[#f37b98]' :
                              index === 2 ? 'bg-[#38b6ff]' :
                              index === 3 ? 'bg-[#9c8dc7]' : 'bg-[#f7b731]'
                            } ${isHovered ? 'brightness-110 shadow-sm' : ''}`} 
                            style={{ width: `${sw.percent}%` }}
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* COMPACT SOCIAL CONTACT SECTION */}
            <section className="px-5 py-4 bg-slate-50 border-t border-slate-100 text-center">
              <h4 className="font-khmer text-xs font-bold text-gray-500 mb-2.5">
                {lang === 'km' ? 'ទំនាក់ទំនង (Contact)' : 'Contact'}
              </h4>

              <div className="flex items-center justify-center gap-2.5 flex-wrap">
                {/* Facebook */}
                <a 
                  href="https://facebook.com" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-[#1877f2] text-white text-xs font-bold shadow-sm hover:-translate-y-0.5 transition-transform"
                  title="Facebook"
                >
                  <i className="fa-brands fa-facebook-f text-sm"></i>
                  <span>Facebook</span>
                </a>

                {/* TikTok */}
                <a 
                  href="https://tiktok.com" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-black text-white border border-gray-800 text-xs font-bold shadow-sm hover:-translate-y-0.5 transition-transform"
                  title="TikTok"
                >
                  <i className="fa-brands fa-tiktok text-sm"></i>
                  <span>TikTok</span>
                </a>

                {/* Telegram */}
                <a 
                  href="https://t.me/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-[#2AABEE] text-white text-xs font-bold shadow-sm hover:-translate-y-0.5 transition-transform"
                  title="Telegram"
                >
                  <i className="fa-brands fa-telegram text-sm"></i>
                  <span>Telegram</span>
                </a>
              </div>
            </section>

            {/* FOOTER BAR */}
            <footer className="bg-brand-navy py-4 text-center text-[10.5px] text-white/70 font-medium">
              © 2025 ឆៃហ្វុង • រក្សាសិទ្ធិគ្រប់យ៉ាង
            </footer>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReactApp />);
  </script>
</body>
</html>
